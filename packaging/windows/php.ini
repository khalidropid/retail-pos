; RetailPOS production php.ini (bundled PHP for Windows).
; Paths are relative to php.exe's folder.

[PHP]
engine = On
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 512M
max_execution_time = 0
max_input_time = 300
; Large enough for uploading a database backup to restore.
upload_max_filesize = 2048M
post_max_size = 2048M
file_uploads = On
default_charset = "UTF-8"
realpath_cache_size = 4096K
realpath_cache_ttl = 600
allow_url_fopen = On
variables_order = "EGPCS"

extension_dir = "ext"
extension = curl
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_pgsql
extension = pgsql
extension = sodium
extension = zip

zend_extension = opcache

[Date]
date.timezone = Asia/Aden

[opcache]
; php -S is the CLI SAPI, so the CLI cache must be on for speed.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

[mbstring]
mbstring.language = neutral
