<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>RetailPOS</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  h1 { margin: 0; font-size: 26px; color: #2dd4bf; }
  .spinner { width: 34px; height: 34px; border: 4px solid #334155; border-top-color: #2dd4bf; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: 15px; }
</style>
</head>
<body>
  <h1>RetailPOS</h1>
  <div class="spinner"></div>
  <p>جارٍ تشغيل النظام، يرجى الانتظار...</p>
</body>
</html>
